
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | DotaDraft</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #0b1120;
      color: #f1f5f9;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 32px;
      background: #151e30;
      border: 1px solid #2d3a50;
      border-radius: 16px;
    }

    h1 { margin: 0 0 8px; color: #f59e0b; }
    .subtitle { color: #a8b3c7; margin-bottom: 24px; }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 22px;
    }

    button {
      cursor: pointer;
      border: 0;
      border-radius: 8px;
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
    }

    .tab {
      flex: 1;
      background: #253149;
      color: #dbe4f0;
    }

    .tab.active {
      background: #f59e0b;
      color: #111827;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      color: #dbe4f0;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #3a4962;
      border-radius: 8px;
      background: #0b1120;
      color: white;
      font-size: 15px;
    }

    .submit {
      width: 100%;
      margin-top: 22px;
      background: #f59e0b;
      color: #111827;
    }

    .back {
      display: block;
      margin-top: 22px;
      text-align: center;
      color: #cbd5e1;
      text-decoration: none;
      font-size: 14px;
    }

    #message {
      margin-top: 16px;
      color: #fbbf24;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>DOTA DRAFT</h1>
    <p class="subtitle">Sign in to access your drafting guides.</p>

    <div class="tabs">
      <button type="button" id="loginTab" class="tab active">Log In</button>
      <button type="button" id="signupTab" class="tab">Sign Up</button>
    </div>

    <form id="authForm">
      <label for="email">Email address</label>
      <input id="email" type="email" autocomplete="email"
             placeholder="you@example.com" required>

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password"
             minlength="8" placeholder="At least 8 characters" required>

      <button class="submit" id="submitButton" type="submit">Log In</button>
    </form>

    <p id="message" role="status"></p>
    <a class="back" href="./index.html">← Back to DotaDraft home</a>
  </main>

  
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://byzcbemjfkhwgyczxpnw.supabase.co/rest/v1/";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_JCqjOY08FpV8pwfzbFKe0Q_7oI-j01v";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  const loginTab = document.getElementById("loginTab");
  const signupTab = document.getElementById("signupTab");
  const submitButton = document.getElementById("submitButton");
  const passwordInput = document.getElementById("password");
  const message = document.getElementById("message");

  let mode = "login";

  function setMode(newMode) {
    mode = newMode;
    loginTab.classList.toggle("active", mode === "login");
    signupTab.classList.toggle("active", mode === "signup");
    submitButton.textContent =
      mode === "login" ? "Log In" : "Create Account";
    passwordInput.autocomplete =
      mode === "login" ? "current-password" : "new-password";
    message.textContent = "";
  }

  loginTab.addEventListener("click", () => setMode("login"));
  signupTab.addEventListener("click", () => setMode("signup"));

  document.getElementById("authForm").addEventListener("submit", async (event) => {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = passwordInput.value;

    submitButton.disabled = true;
    message.textContent = "Please wait...";

    try {
      if (mode === "signup") {
        const { data, error } = await supabaseClient.auth.signUp({
          email,
          password
        });

        if (error) throw error;

        message.textContent = data.session
          ? "Account created! Your access is pending owner approval."
          : "Signup successful! Check your email to confirm your account. Access is pending owner approval.";
      } else {
        const { error } = await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

        if (error) throw error;

        const { data: userData } = await supabaseClient.auth.getUser();

        const { data: profile, error: profileError } = await supabaseClient
          .from("profiles")
          .select("status, role")
          .eq("id", userData.user.id)
          .single();

        if (profileError) throw profileError;

        if (profile.status === "approved" || profile.role === "admin") {
          message.textContent = "Login successful! Guide access is approved. The guide page is coming next.";
        } else {
          await supabaseClient.auth.signOut();
          message.textContent = "Your account is pending approval. Please wait for the owner to approve your access.";
        }
      }
    } catch (error) {
      message.textContent = error.message || "Something went wrong. Please try again.";
    } finally {
      submitButton.disabled = false;
    }
  });
</script>

</body>
</html>
