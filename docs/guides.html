
<!-- Load Supabase FIRST -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL =
    "https://byzcbemjfkhwgyczxpnw.supabase.co";

  // Keep your existing Supabase publishable key here.
  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_JCqjOY08FpV8pwfzbFKe0Q_7oI-j01v";

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  const message = document.getElementById("message");
  const library = document.getElementById("library");
  const guidesContainer = document.getElementById("guides");
  const heroSearchResults =
    document.getElementById("hero-search-results");

  let allGuides = [];
  let heroNamesById = new Map();

  // Load all Dota 2 heroes.
  async function loadHeroRoster() {
    const roster = document.getElementById("hero-roster");
    roster.textContent = "Loading Dota 2 heroes...";

    try {
      const response = await fetch(
        "https://api.opendota.com/api/heroes"
      );

      if (!response.ok) {
        throw new Error("Unable to load heroes.");
      }

      const heroes = await response.json();

      heroNamesById = new Map(
        heroes.map(hero => [
          Number(hero.id),
          hero.localized_name ||
            hero.name.replace("npc_dota_hero_", "")
        ])
      );

      populateEnemyHeroDropdown(heroes);
      renderGuides();

      roster.replaceChildren();

      const details = document.createElement("details");
      const summary = document.createElement("summary");

      summary.textContent =
        `All Dota 2 Heroes (${heroes.length})`;
      summary.style.cursor = "pointer";

      const heroList = document.createElement("div");
      heroList.className = "hero-grid";

      heroes.forEach(hero => {
        const card = document.createElement("div");
        card.className = "hero-card";
        card.textContent = hero.localized_name;
        heroList.appendChild(card);
      });

      details.append(summary, heroList);
      roster.appendChild(details);
    } catch (error) {
      console.error("Hero roster error:", error);
      roster.textContent =
        "Unable to load heroes. Please refresh the page.";
    }
  }

  // Fill the enemy hero dropdown.
  function populateEnemyHeroDropdown(heroes) {
    const dropdown = document.getElementById("enemy-hero");

    if (!dropdown) {
      console.error('Missing element: "enemy-hero"');
      return;
    }

    dropdown.replaceChildren();

    const placeholder = document.createElement("option");
    placeholder.value = "";
    placeholder.textContent = "Choose a hero";
    dropdown.appendChild(placeholder);

    heroes
      .slice()
      .sort((a, b) =>
        a.localized_name.localeCompare(b.localized_name)
      )
      .forEach(hero => {
        const option = document.createElement("option");
        option.value = hero.id;
        option.textContent = hero.localized_name;
        dropdown.appendChild(option);
      });
  }

  // Load counter-matchup data for a selected enemy.
  async function loadCounterMatchups(enemyHeroId) {
    const counterMessage =
      document.getElementById("counter-message");
    const results =
      document.getElementById("counter-results");

    results.replaceChildren();

    if (!enemyHeroId) {
      counterMessage.textContent =
        "Choose an enemy hero to see matchup results.";
      return;
    }

    counterMessage.textContent = "Loading matchup data...";

    try {
      const response = await fetch(
        `https://api.opendota.com/api/heroes/${Number(enemyHeroId)}/matchups`
      );

      if (!response.ok) {
        throw new Error("Unable to load matchup data.");
      }

      const matchups = await response.json();

      const counters = matchups
        .filter(matchup =>
          Number(matchup.games_played) >= 100 &&
          Number(matchup.hero_id) !== Number(enemyHeroId)
        )
        .map(matchup => {
          const games = Number(matchup.games_played);
          const wins = Number(matchup.wins);

          return {
            heroId: Number(matchup.hero_id),
            games,
            winRate: games > 0
              ? ((games - wins) / games) * 100
              : 0
          };
        })
        .sort((a, b) => b.winRate - a.winRate)
        .slice(0, 10);

      const enemyName =
        heroNamesById.get(Number(enemyHeroId)) || "Selected hero";

      counterMessage.textContent =
        `Potential counters against ${enemyName}`;

      if (counters.length === 0) {
        results.textContent =
          "No matchup data available for this hero.";
        return;
      }

      const summary = document.createElement("p");
      summary.textContent =
        "Top 10 potential counters based on opponent win rate " +
        "in available matchup data. These are statistical suggestions, " +
        "not guaranteed counters.";
      results.appendChild(summary);

      const table = document.createElement("table");
      const header = document.createElement("tr");

      ["Potential Counter", "Matches", "Opponent Win Rate"]
        .forEach(label => {
          const th = document.createElement("th");
          th.textContent = label;
          header.appendChild(th);
        });

      table.appendChild(header);

      counters.forEach(counter => {
        const row = document.createElement("tr");

        [
          heroNamesById.get(counter.heroId) ||
            `Hero ${counter.heroId}`,
          counter.games.toLocaleString(),
          `${counter.winRate.toFixed(1)}%`
        ].forEach(value => {
          const cell = document.createElement("td");
          cell.textContent = value;
          row.appendChild(cell);
        });

        table.appendChild(row);
      });

      const wrapper = document.createElement("div");
      wrapper.className = "table-wrap";
      wrapper.appendChild(table);
      results.appendChild(wrapper);
    } catch (error) {
      console.error("Counter matchup error:", error);
      counterMessage.textContent =
        "Unable to load matchup data. Please try again.";
    }
  }

  // Load hero statistics by rank.
  async function loadHeroStats() {
    const statsMessage =
      document.getElementById("stats-message");
    const statsList =
      document.getElementById("stats-list");

    if (!statsMessage || !statsList) return;

    statsMessage.textContent = "Loading hero statistics...";
    statsList.replaceChildren();

    try {
      const response = await fetch(
        "https://api.opendota.com/api/heroStats"
      );

      if (!response.ok) {
        throw new Error("Unable to load hero statistics.");
      }

      const heroes = await response.json();

      const ranks = [
        { label: "Herald", pick: "1_pick", win: "1_win" },
        { label: "Guardian", pick: "2_pick", win: "2_win" },
        { label: "Crusader", pick: "3_pick", win: "3_win" },
        { label: "Archon", pick: "4_pick", win: "4_win" },
        { label: "Legend", pick: "5_pick", win: "5_win" },
        { label: "Ancient", pick: "6_pick", win: "6_win" },
        { label: "Divine", pick: "7_pick", win: "7_win" },
        { label: "Immortal", pick: "8_pick", win: "8_win" }
      ];

      const select = document.createElement("select");
      select.setAttribute("aria-label", "Choose rank");

      ranks.forEach(rank => {
        const option = document.createElement("option");
        option.value = rank.label;
        option.textContent = rank.label;
        select.appendChild(option);
      });

      const table = document.createElement("table");
      const wrapper = document.createElement("div");
      wrapper.className = "table-wrap";
      wrapper.appendChild(table);

      statsList.append(select, wrapper);

      function renderStats() {
        const rank = ranks.find(
          item => item.label === select.value
        );

        if (!rank) return;

        table.replaceChildren();

        const header = document.createElement("tr");

        ["Hero", "Matches", "Win Rate"].forEach(label => {
          const th = document.createElement("th");
          th.textContent = label;
          header.appendChild(th);
        });

        table.appendChild(header);

        const sorted = heroes
          .filter(hero => Number(hero[rank.pick]) > 0)
          .map(hero => ({
            name: hero.localized_name,
            picks: Number(hero[rank.pick]),
            wins: Number(hero[rank.win])
          }))
          .sort((a, b) =>
            (b.wins / b.picks) - (a.wins / a.picks)
          );

        sorted.forEach(hero => {
          const row = document.createElement("tr");
          const winRate =
            (hero.wins / hero.picks * 100).toFixed(1) + "%";

          [
            hero.name,
            hero.picks.toLocaleString(),
            winRate
          ].forEach(value => {
            const cell = document.createElement("td");
            cell.textContent = value;
            row.appendChild(cell);
          });

          table.appendChild(row);
        });

        statsMessage.textContent =
          `Showing ${sorted.length} heroes for ${rank.label}, ` +
          "sorted by win rate.";
      }

      select.addEventListener("change", renderStats);
      renderStats();
    } catch (error) {
      console.error("Hero statistics error:", error);
      statsMessage.textContent =
        "Unable to load hero statistics.";
    }
  }

  // Check the user's login and approval status.
  async function start() {
    if (
      !message ||
      !library ||
      !guidesContainer ||
      !heroSearchResults
    ) {
      console.error(
        "A required HTML element is missing. Check the IDs in guides.html."
      );
      return;
    }

    const { data: authData, error: authError } =
      await db.auth.getUser();

    if (authError || !authData.user) {
      message.textContent =
        "Please log in to access the guide library.";
      return;
    }

    const { data: profile, error: profileError } = await db
      .from("profiles")
      .select("status, role")
      .eq("id", authData.user.id)
      .single();

    if (
      profileError ||
      !profile ||
      (
        profile.status !== "approved" &&
        profile.role !== "admin"
      )
    ) {
      message.textContent =
        "Your account is pending owner approval.";
      return;
    }

    message.textContent =
      "Welcome! Your counter-pick guides are ready.";

    library.hidden = false;

    // Load hero information.
    loadHeroRoster();
    loadHeroStats();

    // Load saved guides from Supabase.
    const { data, error } = await db
      .from("hero_guides")
      .select(
        "id, hero_name, lane, rank_bracket, counter_hero, reason, patch"
      )
      .order("hero_name");

    if (error) {
      console.error("Guide loading error:", error);
      message.textContent =
        "Unable to load guides. Please try again later.";
      return;
    }

    allGuides = data || [];
    renderGuides();
  }

  // Render matching heroes and saved guides without duplicates.
  function renderGuides() {
    const searchInput = document.getElementById("search");
    const laneInput = document.getElementById("lane");
    const rankInput = document.getElementById("rank");

    if (!searchInput || !laneInput || !rankInput) {
      console.error("Search or filter elements are missing.");
      return;
    }

    const query = searchInput.value.trim().toLowerCase();
    const lane = laneInput.value;
    const rank = rankInput.value;

    // Clear both areas every time the user searches.
    heroSearchResults.replaceChildren();
    guidesContainer.replaceChildren();

    const filtered = allGuides.filter(guide => {
      const text = [
        guide.hero_name,
        guide.counter_hero,
        guide.reason,
        guide.rank_bracket,
        guide.patch
      ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();

      return (
        text.includes(query) &&
        (!lane ||
          (guide.lane || "").toLowerCase() === lane.toLowerCase()) &&
        (!rank ||
          (guide.rank_bracket || "").toLowerCase() === rank.toLowerCase())
      );
    });

    const heroMatches = query
      ? [...heroNamesById.entries()].filter(([id, name]) =>
          name.toLowerCase().includes(query)
        )
      : [];

    // Show hero search results near the top.
    if (query && heroMatches.length > 0) {
      const heading = document.createElement("h2");
      heading.textContent =
        `Matching Heroes (${heroMatches.length})`;
      heroSearchResults.appendChild(heading);

      const heroList = document.createElement("div");
      heroList.style.display = "grid";
      heroList.style.gridTemplateColumns =
        "repeat(auto-fill, minmax(150px, 1fr))";
      heroList.style.gap = "8px";

      heroMatches.forEach(([heroId, heroName]) => {
        const card = document.createElement("article");
        card.className = "guide";
        card.style.padding = "10px";

        const title = document.createElement("strong");
        title.textContent = heroName;

        const button = document.createElement("button");
        button.textContent = "Find Counters";
        button.style.display = "block";
        button.style.marginTop = "8px";

        button.addEventListener("click", () => {
          const dropdown = document.getElementById("enemy-hero");

          if (dropdown) {
            dropdown.value = String(heroId);
            loadCounterMatchups(heroId);

            document.getElementById("counter-finder")
              ?.scrollIntoView({
                behavior: "smooth",
                block: "start"
              });
          }
        });

        card.append(title, button);
        heroList.appendChild(card);
      });

      heroSearchResults.appendChild(heroList);
    }

    // Show each matching saved guide once.
    filtered.forEach(guide => {
      const card = document.createElement("article");
      card.className = "guide";

      const title = document.createElement("h2");
      title.textContent = guide.hero_name;

      const counter = document.createElement("p");
      counter.textContent = "Counter pick: " + guide.counter_hero;

      const details = document.createElement("p");
      details.textContent =
        guide.reason || "No explanation added yet.";

      card.append(title, counter, details);

      if (guide.lane || guide.rank_bracket || guide.patch) {
        const tag = document.createElement("span");
        tag.className = "tag";

        tag.textContent = [
          guide.lane,
          guide.rank_bracket,
          guide.patch ? "Patch " + guide.patch : null
        ].filter(Boolean).join(" • ");

        card.appendChild(tag);
      }

      guidesContainer.appendChild(card);
    });

    if (query && heroMatches.length === 0 && filtered.length === 0) {
      const notice = document.createElement("p");
      notice.textContent =
        `No saved guides or heroes found for "${query}".`;
      heroSearchResults.appendChild(notice);
    }

    if (!query && filtered.length === 0) {
      const notice = document.createElement("p");
      notice.textContent =
        "No guides match the selected filters.";
      guidesContainer.appendChild(notice);
    }
  }

  // Connect search and filters.
  document.getElementById("search")
    ?.addEventListener("input", renderGuides);

  document.getElementById("rank")
    ?.addEventListener("change", renderGuides);

  document.getElementById("lane")
    ?.addEventListener("change", renderGuides);

  // Handle startup errors without leaving a blank page.
  start().catch(error => {
    console.error("Startup error:", error);

    if (message) {
      message.textContent =
        "Something went wrong. Open the browser Console for details.";
    }
  });
</script>
