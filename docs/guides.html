
<!-- Supabase library must load before the main script -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(() => {
  "use strict";

  const SUPABASE_URL =
    "https://byzcbemjfkhwgyczxpnw.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_JCqjOY08FpV8pwfzbFKe0Q_7oI-j01v";

  if (!window.supabase?.createClient) {
    console.error("Supabase library did not load.");
    return;
  }

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  const get = id => document.getElementById(id);

  const message = get("message");

  // Support either library ID used in the HTML.
  const library = get("library") || get("guide-library");

  const guidesContainer = get("guides");
  const heroSearchResults = get("hero-search-results");

  let allGuides = [];
  let heroNamesById = new Map();

  function showMessage(text) {
    if (message) message.textContent = text;
  }

  // Load the Dota 2 hero roster.
  async function loadHeroRoster() {
    const roster = get("hero-roster");

    if (!roster) {
      console.error('Missing HTML element: hero-roster');
      return;
    }

    roster.textContent = "Loading Dota 2 heroes...";

    try {
      const response = await fetch(
        "https://api.opendota.com/api/heroes"
      );

      if (!response.ok) {
        throw new Error(`OpenDota error: ${response.status}`);
      }

      const heroes = await response.json();

      heroNamesById = new Map(
        heroes.map(hero => [
          Number(hero.id),
          hero.localized_name ||
            hero.name.replace("npc_dota_hero_", "")
        ])
      );

      populateEnemyHeroDropdown(heroes);

      roster.replaceChildren();

      const details = document.createElement("details");
      const summary = document.createElement("summary");

      summary.textContent =
        `All Dota 2 Heroes (${heroes.length})`;

      const heroList = document.createElement("div");
      heroList.className = "hero-grid";

      heroes.forEach(hero => {
        const card = document.createElement("div");
        card.className = "hero-card";
        card.textContent = hero.localized_name;
        heroList.appendChild(card);
      });

      details.append(summary, heroList);
      roster.appendChild(details);

      renderGuides();
    } catch (error) {
      console.error("Hero roster error:", error);
      roster.textContent = "Unable to load the hero roster.";
    }
  }

  function populateEnemyHeroDropdown(heroes) {
    const dropdown = get("enemy-hero");

    if (!dropdown) {
      console.error('Missing HTML element: enemy-hero');
      return;
    }

    dropdown.replaceChildren();

    const placeholder = document.createElement("option");
    placeholder.value = "";
    placeholder.textContent = "Choose a hero";
    dropdown.appendChild(placeholder);

    heroes
      .slice()
      .sort((a, b) =>
        a.localized_name.localeCompare(b.localized_name)
      )
      .forEach(hero => {
        const option = document.createElement("option");
        option.value = hero.id;
        option.textContent = hero.localized_name;
        dropdown.appendChild(option);
      });

    dropdown.addEventListener("change", () => {
      loadCounterMatchups(dropdown.value);
    });
  }

  // Show the top 10 potential counters for a selected enemy.
  async function loadCounterMatchups(enemyHeroId) {
    const counterMessage = get("counter-message");
    const results = get("counter-results");

    if (!results || !counterMessage) {
      console.error(
        "Missing counter-message or counter-results HTML element."
      );
      return;
    }

    results.replaceChildren();

    if (!enemyHeroId) {
      counterMessage.textContent =
        "Choose an enemy hero to see matchup results.";
      return;
    }

    counterMessage.textContent = "Loading matchup data...";

    try {
      const response = await fetch(
        `https://api.opendota.com/api/heroes/${Number(enemyHeroId)}/matchups`
      );

      if (!response.ok) {
        throw new Error(`OpenDota error: ${response.status}`);
      }

      const matchups = await response.json();

      const counters = matchups
        .filter(item =>
          Number(item.games_played) >= 100 &&
          Number(item.hero_id) !== Number(enemyHeroId)
        )
        .map(item => {
          const games = Number(item.games_played);
          const wins = Number(item.wins);

          return {
            heroId: Number(item.hero_id),
            games,
            winRate: games
              ? ((games - wins) / games) * 100
              : 0
          };
        })
        .sort((a, b) => b.winRate - a.winRate)
        .slice(0, 10);

      const enemyName =
        heroNamesById.get(Number(enemyHeroId)) || "Selected hero";

      counterMessage.textContent =
        `Potential counters against ${enemyName}`;

      const summary = document.createElement("p");
      summary.textContent =
        "These are statistical matchup suggestions, not guaranteed counters.";
      results.appendChild(summary);

      if (!counters.length) {
        const notice = document.createElement("p");
        notice.textContent = "No matchup results found.";
        results.appendChild(notice);
        return;
      }

      const table = document.createElement("table");
      const header = document.createElement("tr");

      ["Potential Counter", "Matches", "Opponent Win Rate"]
        .forEach(label => {
          const th = document.createElement("th");
          th.textContent = label;
          header.appendChild(th);
        });

      table.appendChild(header);

      counters.forEach(item => {
        const row = document.createElement("tr");

        const values = [
          heroNamesById.get(item.heroId) || `Hero ${item.heroId}`,
          item.games.toLocaleString(),
          `${item.winRate.toFixed(1)}%`
        ];

        values.forEach(value => {
          const cell = document.createElement("td");
          cell.textContent = value;
          row.appendChild(cell);
        });

        table.appendChild(row);
      });

      const wrapper = document.createElement("div");
      wrapper.className = "table-wrap";
      wrapper.appendChild(table);
      results.appendChild(wrapper);
    } catch (error) {
      console.error("Counter matchup error:", error);
      counterMessage.textContent =
        "Unable to load matchup data. Please try again.";
    }
  }

  // Load hero statistics by rank.
  async function loadHeroStats() {
    const statsMessage = get("stats-message");
    const statsList = get("stats-list");

    if (!statsMessage || !statsList) {
      console.warn(
        "Hero statistics skipped: stats-message or stats-list is missing."
      );
      return;
    }

    statsMessage.textContent = "Loading hero statistics...";
    statsList.replaceChildren();

    try {
      const response = await fetch(
        "https://api.opendota.com/api/heroStats"
      );

      if (!response.ok) {
        throw new Error(`OpenDota error: ${response.status}`);
      }

      const heroes = await response.json();

      const ranks = [
        { label: "Herald", pick: "1_pick", win: "1_win" },
        { label: "Guardian", pick: "2_pick", win: "2_win" },
        { label: "Crusader", pick: "3_pick", win: "3_win" },
        { label: "Archon", pick: "4_pick", win: "4_win" },
        { label: "Legend", pick: "5_pick", win: "5_win" },
        { label: "Ancient", pick: "6_pick", win: "6_win" },
        { label: "Divine", pick: "7_pick", win: "7_win" },
        { label: "Immortal", pick: "8_pick", win: "8_win" }
      ];

      const select = document.createElement("select");
      select.setAttribute("aria-label", "Choose rank");

      ranks.forEach(rank => {
        const option = document.createElement("option");
        option.value = rank.label;
        option.textContent = rank.label;
        select.appendChild(option);
      });

      const table = document.createElement("table");
      const wrapper = document.createElement("div");
      wrapper.className = "table-wrap";
      wrapper.appendChild(table);

      statsList.append(select, wrapper);

      function renderStats() {
        const rank = ranks.find(
          item => item.label === select.value
        );

        if (!rank) return;

        table.replaceChildren();

        const header = document.createElement("tr");

        ["Hero", "Matches", "Win Rate"].forEach(label => {
          const th = document.createElement("th");
          th.textContent = label;
          header.appendChild(th);
        });

        table.appendChild(header);

        heroes
          .filter(hero => Number(hero[rank.pick]) > 0)
          .map(hero => ({
            name: hero.localized_name,
            picks: Number(hero[rank.pick]),
            wins: Number(hero[rank.win])
          }))
          .sort((a, b) =>
            (b.wins / b.picks) - (a.wins / a.picks)
          )
          .forEach(hero => {
            const row = document.createElement("tr");

            [
              hero.name,
              hero.picks.toLocaleString(),
              `${(hero.wins / hero.picks * 100).toFixed(1)}%`
            ].forEach(value => {
              const cell = document.createElement("td");
              cell.textContent = value;
              row.appendChild(cell);
            });

            table.appendChild(row);
          });

        statsMessage.textContent =
          `Showing hero statistics for ${rank.label}, sorted by win rate.`;
      }

      select.addEventListener("change", renderStats);
      renderStats();
    } catch (error) {
      console.error("Hero statistics error:", error);
      statsMessage.textContent =
        "Unable to load hero statistics.";
    }
  }

  // Search saved guides and Dota 2 heroes.
  function renderGuides() {
    if (!guidesContainer || !heroSearchResults) {
      console.error(
        "Missing guides or hero-search-results. Check those IDs in your HTML."
      );
      return;
    }

    const searchInput = get("search");
    const laneInput = get("lane");
    const rankInput = get("rank");

    if (!searchInput || !laneInput || !rankInput) {
      console.error(
        "Missing search, lane, or rank control. Check the HTML IDs."
      );
      return;
    }

    const query = searchInput.value.trim().toLowerCase();
    const lane = laneInput.value;
    const rank = rankInput.value;

    // Clear old cards to prevent duplicates.
    guidesContainer.replaceChildren();
    heroSearchResults.replaceChildren();

    const filtered = allGuides.filter(guide => {
      const text = [
        guide.hero_name,
        guide.counter_hero,
        guide.reason,
        guide.rank_bracket,
        guide.patch
      ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();

      return (
        text.includes(query) &&
        (!lane ||
          (guide.lane || "").toLowerCase() === lane.toLowerCase()) &&
        (!rank ||
          (guide.rank_bracket || "").toLowerCase() === rank.toLowerCase())
      );
    });

    const heroMatches = query
      ? [...heroNamesById.entries()].filter(([id, name]) =>
          name.toLowerCase().includes(query)
        )
      : [];

    if (query && heroMatches.length) {
      const heading = document.createElement("h2");
      heading.textContent =
        `Matching Heroes (${heroMatches.length})`;
      heroSearchResults.appendChild(heading);

      const heroList = document.createElement("div");
      heroList.style.display = "grid";
      heroList.style.gridTemplateColumns =
        "repeat(auto-fill, minmax(150px, 1fr))";
      heroList.style.gap = "8px";

      heroMatches.forEach(([heroId, heroName]) => {
        const card = document.createElement("article");
        card.className = "guide";

        const title = document.createElement("strong");
        title.textContent = heroName;

        const button = document.createElement("button");
        button.textContent = "Find Counters";

        button.addEventListener("click", () => {
          const dropdown = get("enemy-hero");

          if (dropdown) {
            dropdown.value = String(heroId);
            loadCounterMatchups(heroId);

            get("counter-finder")?.scrollIntoView({
              behavior: "smooth",
              block: "start"
            });
          }
        });

        card.append(title, button);
        heroList.appendChild(card);
      });

      heroSearchResults.appendChild(heroList);
    }

    filtered.forEach(guide => {
      const card = document.createElement("article");
      card.className = "guide";

      const title = document.createElement("h2");
      title.textContent = guide.hero_name;

      const counter = document.createElement("p");
      counter.textContent = "Counter pick: " + guide.counter_hero;

      const reason = document.createElement("p");
      reason.textContent =
        guide.reason || "No explanation added yet.";

      card.append(title, counter, reason);

      if (guide.lane || guide.rank_bracket || guide.patch) {
        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = [
          guide.lane,
          guide.rank_bracket,
          guide.patch ? "Patch " + guide.patch : null
        ].filter(Boolean).join(" • ");

        card.appendChild(tag);
      }

      guidesContainer.appendChild(card);
    });

    if (query && !heroMatches.length && !filtered.length) {
      const notice = document.createElement("p");
      notice.textContent =
        `No saved guides or heroes found for "${query}".`;
      heroSearchResults.appendChild(notice);
    }

    if (!query && !filtered.length) {
      const notice = document.createElement("p");
      notice.textContent =
        "No guides match the selected filters.";
      guidesContainer.appendChild(notice);
    }
  }

  // Start the application.
  async function start() {
    const missing = [];

    if (!message) missing.push("message");
    if (!library) missing.push("library or guide-library");
    if (!guidesContainer) missing.push("guides");
    if (!heroSearchResults) missing.push("hero-search-results");

    if (missing.length) {
      console.error("Missing HTML elements:", missing.join(", "));
      showMessage("Page setup error. Missing: " + missing.join(", "));
      return;
    }

    const { data: authData, error: authError } =
      await db.auth.getUser();

    if (authError || !authData.user) {
      showMessage("Please log in to access the guide library.");
      return;
    }

    const { data: profile, error: profileError } = await db
      .from("profiles")
      .select("status, role")
      .eq("id", authData.user.id)
      .single();

    if (
      profileError ||
      !profile ||
      (profile.status !== "approved" && profile.role !== "admin")
    ) {
      showMessage("Your account is pending owner approval.");
      return;
    }

    showMessage("Welcome! Your counter-pick guides are ready.");
    library.hidden = false;

    // Load public Dota 2 data.
    loadHeroRoster();
    loadHeroStats();

    // Load the saved guides.
    const { data, error } = await db
      .from("hero_guides")
      .select(
        "id, hero_name, lane, rank_bracket, counter_hero, reason, patch"
      )
      .order("hero_name");

    if (error) {
      console.error("Guide loading error:", error);
      showMessage("Unable to load guides. Please try again later.");
      return;
    }

    allGuides = data || [];
    renderGuides();
  }

  // Attach listeners safely.
  get("search")?.addEventListener("input", renderGuides);
  get("rank")?.addEventListener("change", renderGuides);
  get("lane")?.addEventListener("change", renderGuides);

  start().catch(error => {
    console.error("Application startup error:", error);
    showMessage("Something went wrong. Check the browser Console.");
  });
})();
</script>
